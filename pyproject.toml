[project]
name = "phishguard"
version = "1.0.0"
description = "AI-powered phishing URL detection with explainable ML"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PhishGuard" }]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["backend", "ml"]
omit = ["*/__pycache__/*", "ml/train.py"]

[tool.coverage.report]
show_missing = true
